<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Wigma 8 — AI Graphic Design Studio">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wigma 8">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Wigma 8</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #install-banner {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 9999;
      background: #0F172A;
      color: #ffffff;
      padding: 14px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: -apple-system, Roboto, Arial, sans-serif;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.25);
    }
    #install-banner.visible { display: flex; }
    #install-banner .text {
      font-size: 14px;
      line-height: 1.3;
    }
    #install-banner button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #install-btn {
      background: #3B82F6;
      color: #ffffff;
      white-space: nowrap;
    }
    #dismiss-btn {
      background: transparent;
      color: #94A3B8;
      padding: 10px 8px;
    }
  </style>
</head>
<body>
  <div id="install-banner">
    <div class="text">Install Wigma 8 for the full app experience</div>
    <div style="display:flex; align-items:center; gap:4px;">
      <button id="dismiss-btn">Not now</button>
      <button id="install-btn">Install</button>
    </div>
  </div>

  <script>
    let deferredPrompt;
    const banner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');
    const dismissBtn = document.getElementById('dismiss-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!localStorage.getItem('wigma8_install_dismissed')) {
        banner.classList.add('visible');
      }
    });

    installBtn.addEventListener('click', async () => {
      banner.classList.remove('visible');
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    });

    dismissBtn.addEventListener('click', () => {
      banner.classList.remove('visible');
      localStorage.setItem('wigma8_install_dismissed', '1');
    });

    window.addEventListener('appinstalled', () => {
      banner.classList.remove('visible');
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
      </html>
