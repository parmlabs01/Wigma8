name: wigma8
description: "Wigma 8 — AI Graphic Design Studio. Design Anything. In One Prompt."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  equatable: ^2.0.5
  intl: ^0.19.0
  image_picker: ^1.1.2
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.0
  dio: ^5.5.0+1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
